services:
  gunny:
    image: ${GUNNY_IMAGE:-gunny-online:7.7.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080/tcp"
      - "22122:22122/tcp"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY}
      GUNNY_ADMIN_PASSWORD: ${GUNNY_ADMIN_PASSWORD:-}
      GUNNY_PUBLIC_URL: ${GUNNY_PUBLIC_URL:-https://gunnyjava.xubi.org}
      GUNNY_ASSETS: /app/assets1
      PORT: "8080"
      TCP_PORT: "22122"
      MAX_TCP_CLIENTS: ${MAX_TCP_CLIENTS:-128}
      MAX_ROOMS: ${MAX_ROOMS:-8}
    stop_grace_period: 20s
